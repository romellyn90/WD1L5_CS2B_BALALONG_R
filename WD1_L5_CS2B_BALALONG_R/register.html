<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GroceryKo Sign Up</title>
        <!-- Fixed: Added rel="stylesheet" to properly load your CSS -->
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>GroceryKo Sign Up</h1>
        
        <!-- User Registration Form Section -->
        <section id="registrationSection">
            <label for="full_name">Full Name</label><br>
            <input type="text" id="full_name" required><br>

            <label for="address">Address</label><br>
            <input type="text" id="address" required><br>

            <label for="user_name">Username</label><br>
            <input type="text" id="user_name" required><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" required><br>

            <label for="pword">Password</label><br>
            <input type="password" id="pword" required><br><br>

            <button type="button" onclick="saveUserRecord()">Sign Up</button>
            <p id="regMessage"></p>
        </section>

        <!-- Links your JavaScript file -->
        <script src="js/reg.js"></script>
    </body>
</html>
